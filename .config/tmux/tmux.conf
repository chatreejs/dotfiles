# ==============================================================================
# General
# ==============================================================================

# True color + undercurl support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g history-limit 50000
set -sg escape-time 10          # no lag on <Esc> in (Lunar)Vim
set -g focus-events on
set -g display-time 2000

# ==============================================================================
# Prefix: Ctrl-a
# ==============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix            # C-a C-a sends a literal C-a (beginning of line)

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ==============================================================================
# Windows & panes
# ==============================================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split with | and -, keeping the current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ==============================================================================
# Mouse & copy mode (vi)
# ==============================================================================

set -g mouse on
setw -g mode-keys vi
set -s set-clipboard on         # OSC 52, works over SSH too

if-shell "command -v pbcopy" \
    "set -g @copy_cmd 'pbcopy'" \
    "if-shell 'command -v wl-copy' \"set -g @copy_cmd 'wl-copy'\" \"set -g @copy_cmd 'xclip -selection clipboard'\""

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@copy_cmd}"

# ==============================================================================
# Theme: Dracula
# ==============================================================================

set -g @dracula-plugins "git cpu-usage ram-usage kubernetes-context"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-kubernetes-hide-user true
set -g @dracula-git-disable-status false
set -g status-position top

# ==============================================================================
# Plugins (TPM) — keep at the bottom
# ==============================================================================

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

run '~/.tmux/plugins/tpm/tpm'
